name: CI — Hybrid AI Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: hybrid_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Create test .env
        run: |
          cat > configs/.env << EOF
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=changeme
          POSTGRES_DB=hybrid_ai_test
          QDRANT_HOST=localhost
          QDRANT_PORT=6333
          ANTHROPIC_API_KEY=sk-ant-test-key
          OPENAI_API_KEY=sk-test-key
          API_SECRET_KEY=test-secret-key-for-ci
          DOMAIN=synthetic
          FEEDBACK_ERROR_THRESHOLD=0.15
          FEEDBACK_CONSECUTIVE_PERIODS=5
          ANTHROPIC_MODEL=claude-sonnet-4-20250514
          EOF

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            -x

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install black flake8 bandit

      - name: Black format check
        run: black --check src/ tests/

      - name: Flake8 lint
        run: flake8 src/ tests/ --max-line-length=100 --ignore=E501,W503

      - name: Bandit security scan
        run: bandit -r src/ -ll -x src/dashboard/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hybrid-ai-platform:latest .

      - name: Verify image
        run: docker run --rm hybrid-ai-platform:latest python -c "import src; print('Build OK')"
