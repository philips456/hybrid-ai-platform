# Configuration du modèle CNN+LSTM
# Modifier selon les résultats d'expérimentation MLflow

model:
  name: cnn_lstm_hybrid
  version: "1.0.0"

architecture:
  conv_filters: [64, 128]
  conv_kernel_size: 3
  lstm_units: 128
  dense_units: 64
  dropout_rate: 0.2

training:
  window_size: 24          # TODO: Optimiser selon le domaine
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  patience: 10             # EarlyStopping
  validation_split: 0.15
  test_split: 0.15
  random_seed: 42

anomaly_detection:
  threshold_percentile: 99
  consecutive_periods: 5

feedback_loop:
  error_threshold: 0.15
  min_periods: 5
  auto_approve: false      # Toujours HITL en production
