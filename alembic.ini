# alembic.ini — Configuration Alembic
# Gestion des migrations de base de données

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# URL de connexion — surchargée par env.py via settings
sqlalchemy.url = postgresql://postgres:changeme@localhost:5432/hybrid_ai_db

[post_write_hooks]
# Formatage automatique des migrations générées
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
