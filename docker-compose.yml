# ══════════════════════════════════════════════════════
# docker-compose.yml — Hybrid AI Platform
# Lance tous les services en une commande :
# docker-compose up -d
# ══════════════════════════════════════════════════════

version: "3.9"

services:

  # ── POSTGRESQL + TIMESCALEDB ────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: hybrid_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hybrid_ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hybrid_ai_network

  # ── QDRANT ──────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: hybrid_ai_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hybrid_ai_network

  # ── MLFLOW ──────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.2
    container_name: hybrid_ai_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-hybrid_ai_db}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/artifacts/mlflow.db
      --default-artifact-root /mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - hybrid_ai_network

  # ── API FASTAPI ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hybrid_ai_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - configs/.env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - hybrid_ai_network

# ── VOLUMES ─────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  mlflow_artifacts:
    driver: local

# ── NETWORK ──────────────────────────────────────────
networks:
  hybrid_ai_network:
    driver: bridge
